<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>🇮🇹 Italy Grand Tour</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#f4f1eb;
color:#222;
}
#searchBar{
    background:white;
    padding:12px;
    border-bottom:1px solid #ddd;
}

#searchInput{
    width:100%;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:8px;
}
header{
background:#8B1E2D;
color:white;
padding:20px;
text-align:center;
}

header h1{
font-size:32px;
}

header p{
margin-top:8px;
opacity:.9;
}

#days{
display:flex;
overflow-x:auto;
gap:10px;
padding:12px;
background:white;
position:sticky;
top:0;
z-index:999;
}

#days button{
border:none;
background:#8B1E2D;
color:white;
padding:10px 18px;
border-radius:20px;
font-size:15px;
cursor:pointer;
white-space:nowrap;
}

#days button:hover{
background:#b3263b;
}

#map{
height:50vh;
width:100%;
}

#info{
padding:20px;
background:white;
}

#info h2{
color:#8B1E2D;
margin-bottom:10px;
}

#info h3{
margin-top:15px;
}

#info ul{
padding-left:20px;
margin-top:8px;
}

footer{
background:#222;
color:white;
padding:18px;
text-align:center;
margin-top:20px;
font-size:14px;
}

@media(max-width:700px){

header h1{
font-size:28px;
}

#map{
height:45vh;
}

}

</style>

</head>

<body>

<header>

<h1>🇮🇹 Italy Grand Tour</h1>

<p>
11 Days • Milan → Florence → Rome
</p>

</header>
<div id="searchBar">
    <input
        type="text"
        id="searchInput"
        placeholder="Search attractions..."
    >
</div>
<div id="days"></div>
<div id="searchBar">
  <input
    type="text"
    id="searchInput"
    placeholder="🔍 Search attractions..."
  >
</div>

<div id="map"></div>

<div id="info">

<h2>
Welcome
</h2>

<p>

Tap a day above to explore your itinerary.

</p>

</div>

<footer>

Made with ❤️ for your Italy adventure

</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="script.js"></script>

</body>

</html>
