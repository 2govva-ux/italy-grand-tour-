<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Italy Grand Tour 🇮🇹</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link rel="stylesheet" href="css/style.css">

<body>

<header class="hero">

<h1>Italy Grand Tour</h1>

11 unforgettable days through Milan, Florence, Tuscany, Rome and Naples.
</p>

<nav class="timeline">

<button data-day="2">Day 2</button>
<button data-day="3">Day 3</button>
<button data-day="4">Day 4</button>
<button data-day="5">Day 5</button>
<button data-day="6">Day 6</button>
<button data-day="7">Day 7</button>
<button data-day="8">Day 8</button>
<button data-day="9">Day 9</button>

</nav>

<main>

<section id="map"></section>

<section id="itinerary">

<h2>Welcome to Italy 🇮🇹</h2>

<p>
Choose a day above to explore your itinerary.
</p>

</section>

</main>

<footer>

<button>🏠 Home</button>
<button>🗺 Map</button>
<button>📅 Itinerary</button>
<button>❤️ Favorites</button>

</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

script src="js/data.js"></script>
