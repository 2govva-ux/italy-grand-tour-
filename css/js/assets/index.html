<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Italy Grand Tour</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="hero">

    <div class="hero-content">

        <h1>🇮🇹 Italy Grand Tour</h1>

        <p class="subtitle">
            Milan • Florence • Tuscany • Rome • Vatican
        </p>

        <button id="startJourney">
            Begin Journey
        </button>

    </div>

</header>

<nav class="timeline">

    <button data-day="1">Day 1</button>
    <button data-day="2">Day 2</button>
    <button data-day="3">Day 3</button>
    <button data-day="4">Day 4</button>
    <button data-day="5">Day 5</button>
    <button data-day="6">Day 6</button>
    <button data-day="7">Day 7</button>
    <button data-day="8">Day 8</button>
    <button data-day="9">Day 9</button>
    <button data-day="10">Day 10</button>
    <button data-day="11">Day 11</button>

</nav>

<main>

<section id="map"></section>

<section id="itinerary">

    <h2>Welcome</h2>

    <p>
        Select a day above to explore your Italian adventure.
    </p>

</section>

</main>

<footer>

    <button>🗺 Map</button>

    <button>📅 Itinerary</button>

    <button>📍 Places</button>

    <button>🍝 Food</button>

    <button>💶 Budget</button>

</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>

</body>
</html>
